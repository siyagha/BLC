  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDOLRT8QSP4mAoys-1d-QC_GiCWFbd09gM",
    authDomain: "blc-app-427f8.firebaseapp.com",
    databaseURL: "https://blc-app-427f8-default-rtdb.firebaseio.com",
    projectId: "blc-app-427f8",
    storageBucket: "blc-app-427f8.firebasestorage.app",
    messagingSenderId: "23945574366",
    appId: "1:23945574366:web:24aef033178dd9918d92f7",
    measurementId: "G-C7VE3QFS9Q"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  const dataRef = ref(database, 'appState/');

  // دالة إرسال البيانات المحفوظة محلياً إلى السحابة
  window.syncToCloud = function() {
    const allData = JSON.stringify(localStorage);
    set(dataRef, allData);
  };

  // استقبال البيانات المحدثة تلقائياً من السحابة وتحديث الجهاز
  onValue(dataRef, (snapshot) => {
    const cloudData = snapshot.val();
    if (cloudData) {
      const parsedData = JSON.parse(cloudData);
      let isUpdated = false;

      Object.keys(parsedData).forEach(key => {
        if (localStorage.getItem(key) !== parsedData[key]) {
          localStorage.setItem(key, parsedData[key]);
          isUpdated = true;
        }
      });

      // إذا ظهرت بيانات جديدة قادمة من جهاز آخر، يتم تحديث الواجهة فوراً
      if (isUpdated) {
        location.reload();
      }
    }
  });
</script>

<title>BLC — تسيير الشركة</title>
<style>
:root{
  --bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --blue:#1d4ed8;--blue-dark:#1e3a8a;--green:#16a34a;--greenBg:#dcfce7;
  --yellow:#ca8a04;--yellowBg:#fef9c3;--red:#dc2626;--redBg:#fee2e2;--gray:#94a3b8;--grayBg:#f1f5f9;
}
[data-theme="dark"]{--bg:#0b1220;--card:#16213a;--text:#f1f5f9;--muted:#94a3b8;--border:#2c3d5a;--grayBg:#1e293b;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);min-height:100%}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:700;margin:0}
.hdr{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));display:flex;align-items:center;justify-content:space-between;z-index:5}
.brand{display:flex;align-items:center;gap:8px}
.brand img{height:40px;width:auto;display:block;border-radius:6px}
.brand b{color:var(--blue-dark);font-size:20px}
.iconbtn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{flex:1;min-width:70px;text-align:center;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;margin-bottom:8px}
button.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
button.btn.sec{background:var(--gray)}
button.btn.danger{background:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border-bottom:none}
.muted{color:var(--muted);font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:20px;color:var(--blue-dark)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:1px solid var(--border);gap:1px}
.d-full{background:var(--greenBg);color:var(--green);border-color:var(--green)}
.d-half{background:var(--yellowBg);color:var(--yellow);border-color:var(--yellow)}
.d-absent{background:var(--redBg);color:var(--red);border-color:var(--red)}
.d-weekend{background:var(--redBg);color:var(--red);opacity:.6}
.d-empty{background:var(--grayBg);color:var(--muted)}
.d-sel{outline:2px solid var(--blue-dark)}
.login{display:flex;align-items:center;justify-content:center;min-height:90vh;padding:16px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--blue);color:#fff}
label{font-size:12px;color:var(--muted)}
</style>

}
function loginSetup(){return `<div class="login"><div class="card" style="width:100%;max-width:340px">

function bindLogin(){
const err=document.getElementById('err');
const setBtn=document.getElementById('setBtn');
if(setBtn){setBtn.onclick=()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(!a){err.textContent=t('pass');return;}if(a!==b){err.textContent=t('mismatch');return;}S.pass=a;S.logged=true;save();render();};}

if(loginBtn){loginBtn.onclick=()=>{const a=document.getElementById('p1').value;if(a!==S.pass){err.textContent=t('wrongpass');return;}S.logged=true;save();render();};}
}

function content(){
if(S.tab==='dash')return dash();
if(S.tab==='sites')return sitesTab();
if(S.tab==='workers')return workersTab();
if(S.tab==='att')return attTab();
if(S.tab==='pay')return payTab();
if(S.tab==='fin')return finTab();

function getAlerts(){
const list=[];
S.sites.forEach(s=>{
const mat=S.expenses.filter(e=>e.siteId===s.id&&e.type==='material').reduce((a,b)=>a+Number(b.amount),0);
const other=S.expenses.filter(e=>e.siteId===s.id&&e.type==='other').reduce((a,b)=>a+Number(b.amount),0);
const labor=siteLaborCost(s.id);
const income=S.income.filter(i=>i.siteId===s.id).reduce((a,b)=>a+Number(b.amount),0);
if(income>0&&mat+other+labor>income)list.push({type:'budget',text:s.name});
});
S.workers.forEach(w=>{
const entries=Object.keys(S.att).filter(k=>k.startsWith(w.id+':')&&S.att[k].status).sort();
const last3=entries.slice(-3).map(k=>S.att[k].status);
if(last3.length===3&&last3.every(st=>st==='absent'))list.push({type:'absence',text:w.name});
});
const today=new Date();
S.equipment.forEach(eq=>{
if(eq.maintenanceDate){const diff=(new Date(eq.maintenanceDate)-today)/86400000;if(diff<=7)list.push({type:'maintenance',text:eq.name});}
});
return list;
}

}).join(''):`<p class="muted">—</p>`}</div>`;

function siteLaborCost(siteId){
let total=0;
S.workers.filter(w=>w.siteId===siteId).forEach(w=>{
let full=0,half=0;
Object.keys(S.att).forEach(k=>{if(k.startsWith(w.id+':')){const r=S.att[k];if(r.status==='full')full++;else if(r.status==='half')half++;}});
const bonus=S.bonus.filter(b=>b.workerId===w.id).reduce((a,b)=>a+Number(b.amount),0);
total+=(full+half*0.5)*(w.wage||0)+bonus;
});
return total;
}

<input id="incAmt" type="number" placeholder="${t('amount')}">

<button class="btn" id="addIncBtn">${t('addIncome')}</button></div>
<div class="card"><h3>${t('budgetSplit')}</h3>${bucketsHtml}</div>`;

const WD={ar:['ح','ن','ث','ر','خ','ج','س'],fr:['D','L','M','M','J','V','S']};
function monthDays(month){const [y,m]=month.split('-').map(Number);return new Date(y,m,0).getDate();}
function attTab(){

<input type="month" id="attMonth" value="${S.sel.month}"></div>
<div class="card"><div class="cal">${cells}</div></div>${panel}`;

function monthNet(workerId,month){
const w=S.workers.find(x=>x.id===workerId);
if(!w)return{full:0,half:0,absent:0,base:0,bonus:0,adv:0,net:0};
let full=0,half=0,absent=0;
Object.keys(S.att).forEach(k=>{if(k.startsWith(workerId+':'+month)){const r=S.att[k];if(r.status==='full')full++;else if(r.status==='half')half++;else if(r.status==='absent')absent++;}});
const base=(full+half*0.5)*(w.wage||0);
const bonus=S.bonus.filter(b=>b.workerId===workerId&&b.month===month).reduce((a,b)=>a+Number(b.amount),0);
const adv=S.adv.filter(a=>a.workerId===workerId&&a.month===month).reduce((a,b)=>a+Number(b.amount),0);
return{full,half,absent,base,bonus,adv,net:base+bonus-adv};
}
function fmt(n){return Math.round(n).toLocaleString();}
function workerMonths(workerId){
const set=new Set();
Object.keys(S.att).forEach(k=>{if(k.startsWith(workerId+':'))set.add(k.split(':')[1].slice(0,7));});
S.bonus.forEach(b=>{if(b.workerId===workerId)set.add(b.month);});
S.adv.forEach(a=>{if(a.workerId===workerId)set.add(a.month);});
set.add(S.sel.month);
return Array.from(set).sort().reverse();
}
function payTab(){
if(!S.workers.length)return `<p class="muted">${t('noWorkers')}</p>`;
if(!S.sel.worker)S.sel.worker=S.workers[0].id;
const wopts=S.workers.map(w=>`<option value="${w.id}" ${S.sel.worker===w.id?'selected':''}>${w.name}</option>`).join('');
const r=monthNet(S.sel.worker,S.sel.month);
const paidKey=S.sel.worker+':'+S.sel.month;
const isPaid=!!S.paid[paidKey];
const months=workerMonths(S.sel.worker);
const histHtml=months.map(m=>{const p=!!S.paid[S.sel.worker+':'+m];return `<div class="row" data-month-select="${m}" style="cursor:pointer"><span>${m}${m===S.sel.month?' ◀':''}</span><span class="badge" style="background:${p?'var(--green)':'var(--red)'}">${p?t('paid'):t('unpaid')}</span></div>`;}).join('');
return `<div class="card"><select id="payWorker">${wopts}</select><input type="month" id="payMonth" value="${S.sel.month}"></div>
<div class="card"><h3>${t('summary')}</h3>
<div class="row"><span>${t('daysFull')}</span><b>${r.full}</b></div>
<div class="row"><span>${t('daysHalf')}</span><b>${r.half}</b></div>
<div class="row"><span>${t('daysAbsent')}</span><b>${r.absent}</b></div>
<div class="row"><span>${t('base')}</span><b>${fmt(r.base)}</b></div>
<div class="row"><span>${t('bonus')}</span><b>${fmt(r.bonus)}</b></div>
<div class="row"><span>${t('advance')}</span><b>-${fmt(r.adv)}</b></div>
<div class="row" style="font-size:16px"><span>${t('net')}</span><b style="color:var(--blue-dark)">${fmt(r.net)}</b></div>
<div class="row"><span>${t('paidStatus')}</span><span class="badge" style="background:${isPaid?'var(--green)':'var(--red)'}">${isPaid?t('paid'):t('unpaid')}</span></div>
<button class="btn ${isPaid?'sec':''}" id="togglePaidBtn" style="width:100%">${isPaid?t('markUnpaid'):t('markPaid')}</button>
</div>
<div class="card"><h3>${t('monthsHistory')}</h3>${histHtml}</div>
<div class="card"><label>${t('addBonus')}</label><input id="bonusAmt" type="number" placeholder="${t('amount')}"><button class="btn" id="addBonusBtn">${t('add')}</button></div>
<div class="card"><label>${t('addAdvance')}</label><input id="advAmt" type="number" placeholder="${t('amount')}"><button class="btn" id="addAdvBtn">${t('add')}</button></div>`;
}
function bindShell(){
document.getElementById('langBtn').onclick=()=>{S.lang=S.lang==='ar'?'fr':'ar';save();render();};
document.getElementById('themeBtn').onclick=()=>{S.theme=S.theme==='light'?'dark':'light';save();render();};
document.getElementById('outBtn').onclick=()=>{S.logged=false;save();render();};
document.getElementById('exportBtn').onclick=()=>{
try{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download='blc_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}catch(e){}
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
const f=e.target.files[0];if(!f)return;
const reader=new FileReader();
reader.onload=ev=>{try{const obj=JSON.parse(ev.target.result);S=Object.assign({},S,obj);save();render();}catch(err){alert(t('invalidFile'));}};
reader.readAsText(f);
};
document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{S.tab=el.dataset.tab;S.sel.day=null;save();render();});
if(S.tab==='sites'){
document.getElementById('addSiteBtn').onclick=()=>{const v=document.getElementById('siteName').value.trim();if(!v)return;S.sites.push({id:uid(),name:v,status:'active'});save();render();};
document.querySelectorAll('[data-del-site]').forEach(b=>b.onclick=()=>{S.sites=S.sites.filter(s=>s.id!==b.dataset.delSite);save();render();});
}
if(S.tab==='workers'){
document.getElementById('addWorkerBtn').onclick=()=>{const n=document.getElementById('wName').value.trim();if(!n)return;S.workers.push({id:uid(),name:n,phone:document.getElementById('wPhone').value,wage:Number(document.getElementById('wWage').value)||0,siteId:document.getElementById('wSite').value});save();render();};
document.querySelectorAll('[data-del-worker]').forEach(b=>b.onclick=()=>{S.workers=S.workers.filter(w=>w.id!==b.dataset.delWorker);save();render();});
}
if(S.tab==='att'){
document.getElementById('attWorker').onchange=e=>{S.sel.worker=e.target.value;S.sel.day=null;save();render();};
document.getElementById('attMonth').onchange=e=>{S.sel.month=e.target.value;S.sel.day=null;save();render();};
document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{S.sel.day=el.dataset.day;save();render();});
document.querySelectorAll('[data-setstatus]').forEach(b=>b.onclick=()=>{const key=S.sel.worker+':'+S.sel.day;const cur=S.att[key]||{status:'',note:''};cur.status=b.dataset.setstatus;S.att[key]=cur;save();render();});
const nb=document.getElementById('saveNoteBtn');
if(nb)nb.onclick=()=>{const key=S.sel.worker+':'+S.sel.day;const cur=S.att[key]||{status:'',note:''};cur.note=document.getElementById('dayNote').value;S.att[key]=cur;save();render();};
}
if(S.tab==='pay'){
document.getElementById('payWorker').onchange=e=>{S.sel.worker=e.target.value;save();render();};
document.getElementById('payMonth').onchange=e=>{S.sel.month=e.target.value;save();render();};
document.getElementById('addBonusBtn').onclick=()=>{const v=Number(document.getElementById('bonusAmt').value);if(!v)return;S.bonus.push({id:uid(),workerId:S.sel.worker,month:S.sel.month,amount:v});save();render();};
document.getElementById('addAdvBtn').onclick=()=>{const v=Number(document.getElementById('advAmt').value);if(!v)return;S.adv.push({id:uid(),workerId:S.sel.worker,month:S.sel.month,amount:v});save();render();};
document.getElementById('togglePaidBtn').onclick=()=>{const key=S.sel.worker+':'+S.sel.month;S.paid[key]=!S.paid[key];save();render();};
document.querySelectorAll('[data-month-select]').forEach(el=>el.onclick=()=>{S.sel.month=el.dataset.monthSelect;save();render();});
}
if(S.tab==='fin'){
document.getElementById('finSite').onchange=e=>{S.sel.site=e.target.value;save();render();};
document.getElementById('addExpBtn').onclick=()=>{
const amt=Number(document.getElementById('expAmt').value);if(!amt)return;
const rec={id:uid(),siteId:S.sel.site,type:document.getElementById('expType').value,desc:document.getElementById('expDesc').value,amount:amt,date:document.getElementById('expDate').value};
const file=document.getElementById('expReceipt').files[0];
if(file){const reader=new FileReader();reader.onload=ev=>{rec.receipt=ev.target.result;S.expenses.push(rec);save();render();};reader.readAsDataURL(file);}
else{S.expenses.push(rec);save();render();}
};
document.querySelectorAll('[data-del-exp]').forEach(b=>b.onclick=()=>{S.expenses=S.expenses.filter(e=>e.id!==b.dataset.delExp);save();render();});
document.getElementById('addIncBtn').onclick=()=>{const amt=Number(document.getElementById('incAmt').value);if(!amt)return;S.income.push({id:uid(),siteId:S.sel.site,type:document.getElementById('incType').value,amount:amt,date:document.getElementById('incDate').value});save();render();};
document.querySelectorAll('[data-del-inc]').forEach(b=>b.onclick=()=>{S.income=S.income.filter(i=>i.id!==b.dataset.delInc);save();render();});
}
if(S.tab==='equip'){
document.getElementById('addEquipBtn').onclick=()=>{const n=document.getElementById('eqName').value.trim();if(!n)return;S.equipment.push({id:uid(),name:n,type:document.getElementById('eqType').value,rentCost:Number(document.getElementById('eqRent').value)||0,maintenanceDate:document.getElementById('eqMaint').value});save();render();};
document.querySelectorAll('[data-del-equip]').forEach(b=>b.onclick=()=>{S.equipment=S.equipment.filter(e=>e.id!==b.dataset.delEquip);save();render();});
}
}
render();
</script>
</body>
</html>
